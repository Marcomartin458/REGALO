<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Música de a Bordo · Marta Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/musica.css">
</head>
<body class="musica-body">

  <div class="aura-fondo" aria-hidden="true">
    <div class="aura-luz aura-luz--1"></div>
    <div class="aura-luz aura-luz--2"></div>
  </div>

  <header class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="marca">
        <svg class="marca__icono" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        <span class="marca__texto">MARTA <span>AIRLINES</span></span>
        <span class="marca__vuelo">GATE B-02</span>
      </a>
      <button class="hamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-enlaces">
        <a href="index.html" data-pagina="index.html">Ventanilla</a>
        <a href="amigos.html" data-pagina="amigos.html">Amigos</a>
        <a href="musica.html" data-pagina="musica.html" class="activo">Música</a>
        <a href="secreto.html" data-pagina="secreto.html">Secreto</a>
        <a href="raices.html" data-pagina="raices.html">Raíces</a>
      </nav>
    </div>
  </header>

  <main class="musica-layout">

    <section class="hero-player" data-reveal>
      <div class="hero-player__cover-wrap">
        <div class="hero-player__cover" id="hero-cover">
          <div class="hero-player__vinyl-grooves">
            <div class="vinyl-center"></div>
          </div>
        </div>
      </div>
      <div class="hero-player__content">
        <span class="hero-player__badge">Sonando ahora</span>
        <h1 class="hero-player__title" id="hero-titulo">—</h1>
        <p class="hero-player__artist" id="hero-artista">—</p>
        <p class="hero-player__note" id="hero-nota"></p>
        <div class="hero-player__controls">
          <button class="btn-play-hero" id="hero-play" type="button" aria-label="Reproducir"></button>
          <canvas class="hero-visualizer" id="visualizador"></canvas>
        </div>
      </div>
    </section>

    <div class="musica-toolbar">
      <label class="toolbar__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="musica-buscador-input" placeholder="Buscar canción o artista" autocomplete="off">
      </label>
      <div class="toolbar__actions">
        <button class="btn-tool" id="sidebar-aleatorio" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          Aleatorio
        </button>
        <span class="counter-badge" id="stat-total">0 canciones</span>
      </div>
    </div>

    <p class="musica-estado-msg" id="musica-estado"></p>

    <div class="musica-lista-wrap">
      <div class="lista-cabecera"><span>#</span><span>Título</span><span>Duración</span></div>
      <div class="canciones-grid" id="musica-lista"></div>
    </div>

  </main>

  <div class="dock-player">
    <div class="dock-track">
      <div class="dock-track__thumb" id="barra-mini"></div>
      <div class="dock-track__meta">
        <span class="dock-track__name" id="barra-titulo">—</span>
        <span class="dock-track__artist" id="barra-artista">—</span>
      </div>
    </div>

    <div class="dock-controls">
      <div class="dock-controls__buttons">
        <button class="btn-dock-ctrl" id="barra-aleatorio" type="button" aria-label="Aleatorio" title="Aleatorio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="btn-dock-ctrl" id="barra-prev" type="button" aria-label="Anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>
        <button class="btn-dock-play" id="barra-play" type="button" aria-label="Reproducir"></button>
        <button class="btn-dock-ctrl" id="barra-next" type="button" aria-label="Siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
        <button class="btn-dock-ctrl" id="barra-repetir" type="button" aria-label="Repetir" title="Repetir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="dock-seek">
        <time id="tiempo-actual">0:00</time>
        <div class="dock-seek__bar" id="barra-progreso"><div class="dock-seek__fill" id="barra-progreso-relleno"></div></div>
        <time id="tiempo-total">0:00</time>
      </div>
      <p class="musica-estado-msg" id="barra-aviso" style="margin-top:.35rem;"></p>
    </div>

    <div class="dock-volume">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input type="range" id="barra-volumen" min="0" max="100" value="75" aria-label="Volumen">
    </div>
  </div>

  <audio id="audio-elemento" preload="metadata"></audio>



  <script src="assets/js/musica-datos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/musica.js"></script>
</body>
</html>
